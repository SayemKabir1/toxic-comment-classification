[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toxic-comment-classification"
version = "1.0.0"
description = "A reproducible baseline for multi-label toxic comment classification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3,<2.0",
  "pandas>=2.0,<4.0",
  "scikit-learn>=1.3,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<10.0"]

[project.scripts]
toxic-train = "toxic_comment_classifier.train:main"
toxic-predict = "toxic_comment_classifier.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
